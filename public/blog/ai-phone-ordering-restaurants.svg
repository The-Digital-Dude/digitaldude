<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI phone ordering flow: call, menu check, order, kitchen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1A1A4E"/><stop offset="1" stop-color="#12123A"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif">
    <text x="80" y="120" fill="#8B7FF0" font-size="20" font-weight="700" letter-spacing="3">AI ENGINEERING</text>
    <text x="80" y="190" fill="#FFFFFF" font-size="52" font-weight="800">AI phone ordering</text>
    <text x="80" y="252" fill="#FFFFFF" font-size="52" font-weight="800">for restaurants</text>
    <g transform="translate(80,340)" font-size="20" fill="#E8E6FF" text-anchor="middle">
      <rect width="210" height="110" rx="14" fill="#20204E"/><text x="105" y="52">Customer</text><text x="105" y="80" fill="#8B87B8" font-size="16">calls the venue</text>
      <path d="M215 55 H255" stroke="#5B4FE8" stroke-width="3"/><path d="M247 47 L257 55 L247 63" fill="none" stroke="#5B4FE8" stroke-width="3"/>
      <g transform="translate(260,0)"><rect width="210" height="110" rx="14" fill="#20204E"/><text x="105" y="52">AI agent</text><text x="105" y="80" fill="#8B87B8" font-size="16">asks for the menu</text></g>
      <path d="M475 55 H515" stroke="#5B4FE8" stroke-width="3"/><path d="M507 47 L517 55 L507 63" fill="none" stroke="#5B4FE8" stroke-width="3"/>
      <g transform="translate(520,0)"><rect width="210" height="110" rx="14" fill="#5B4FE8"/><text x="105" y="52">Live menu</text><text x="105" y="80" fill="#E8E6FF" font-size="16">real items and prices</text></g>
      <path d="M735 55 H775" stroke="#5B4FE8" stroke-width="3"/><path d="M767 47 L777 55 L767 63" fill="none" stroke="#5B4FE8" stroke-width="3"/>
      <g transform="translate(780,0)"><rect width="210" height="110" rx="14" fill="#20204E"/><text x="105" y="52">Kitchen</text><text x="105" y="80" fill="#8B87B8" font-size="16">ticket + SMS confirm</text></g>
    </g>
    <text x="80" y="595" fill="#8B87B8" font-size="18">The Digital Dude</text>
  </g>
