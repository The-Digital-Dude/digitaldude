<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1A1A4E"/>
      <stop offset="1" stop-color="#12123A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg5)"/>

  <g stroke="#2A2A5C" stroke-width="1" opacity="0.5">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
  </g>

  <!-- Left: plain gear, labelled "label only" -->
  <g transform="translate(220,195)">
    <circle cx="120" cy="120" r="90" fill="#20204E" stroke="#3A3A72" stroke-width="2"/>
    <g fill="#3A3A72">
      <rect x="112" y="10" width="16" height="30" rx="4"/>
      <rect x="112" y="200" width="16" height="30" rx="4"/>
      <rect x="10" y="112" width="30" height="16" rx="4"/>
      <rect x="200" y="112" width="30" height="16" rx="4"/>
      <rect x="45" y="45" width="16" height="30" rx="4" transform="rotate(45 53 60)"/>
      <rect x="179" y="185" width="16" height="30" rx="4" transform="rotate(45 187 200)"/>
      <rect x="45" y="195" width="16" height="30" rx="4" transform="rotate(-45 53 210)"/>
      <rect x="179" y="45" width="16" height="30" rx="4" transform="rotate(-45 187 60)"/>
    </g>
    <circle cx="120" cy="120" r="50" fill="#12123A"/>
    <text x="120" y="127" fill="#6C68A0" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="700">"AI"</text>
    <text x="120" y="330" fill="#8B87B8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="700">LABEL ONLY</text>
  </g>

  <!-- Right: spark/circuit, labelled "genuine use" -->
  <g transform="translate(760,195)">
    <circle cx="120" cy="120" r="90" fill="#5B4FE8"/>
    <path d="M 130 40 L 90 130 L 118 130 L 106 200 L 160 110 L 130 110 Z" fill="#FFFFFF"/>
    <g stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.5">
      <circle cx="120" cy="120" r="72"/>
    </g>
    <text x="120" y="330" fill="#8B87B8" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="700">GENUINE USE</text>
  </g>

  <!-- vs divider -->
  <text x="600" y="330" fill="#4A4A8C" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-weight="700" font-style="italic">vs</text>
</svg>
