<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Four search intent tiers for software companies">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1A1A4E"/><stop offset="1" stop-color="#12123A"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g font-family="Arial, sans-serif">
    <text x="80" y="120" fill="#8B7FF0" font-size="20" font-weight="700" letter-spacing="3">GOOGLE ADS &amp; PPC</text>
    <text x="80" y="190" fill="#FFFFFF" font-size="52" font-weight="800">Google Ads for software</text>
    <text x="80" y="252" fill="#FFFFFF" font-size="52" font-weight="800">companies: pay for intent</text>
    <g transform="translate(80,330)" font-size="20" fill="#E8E6FF">
      <rect width="1040" height="46" rx="10" fill="#4ADE80" fill-opacity="0.9"/><text x="24" y="30" fill="#0F2A1A" font-weight="700">Tier 1 · Ready to hire</text>
      <g transform="translate(0,58)"><rect width="860" height="46" rx="10" fill="#8B7FF0"/><text x="24" y="30" fill="#12123A" font-weight="700">Tier 2 · Researching the price</text></g>
      <g transform="translate(0,116)"><rect width="680" height="46" rx="10" fill="#5B4FE8"/><text x="24" y="30" font-weight="700">Tier 3 · Comparing options</text></g>
      <g transform="translate(0,174)"><rect width="500" height="46" rx="10" fill="#2A2A5C"/><text x="24" y="30" fill="#9490BF" font-weight="700">Tier 4 · Learning (leave to SEO)</text></g>
    </g>
    <text x="80" y="595" fill="#8B87B8" font-size="18">The Digital Dude</text>
  </g>
</svg>
