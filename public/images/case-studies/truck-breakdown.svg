  <circle cx="500" cy="260" r="9" fill="#5B4FE8"/>
  <circle cx="320" cy="320" r="6" fill="#5B4FE8" opacity="0.6"/>
  <circle cx="460" cy="440" r="6" fill="#5B4FE8" opacity="0.6"/>

  <!-- Incident detail -->
  <rect x="546" y="200" width="194" height="164" rx="10" fill="#20204E"/>
