  <path d="M240 500 C 300 440, 340 470, 380 400 S 460 320, 500 260" stroke="#3A3A6E" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="240" cy="500" r="9" fill="#4ADE80"/>
  <g transform="translate(400,380)">
