name: Daily Lead Generation & Rep CRM Outreach Pipeline

on:
  schedule:
    # Runs every day at 8:00 PM UTC (20:00)
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      auto_send:
        description: 'Auto-send cold outreach emails via Brevo immediately?'
        required: true
        type: boolean
        default: true

jobs:
  lead-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --no-audit

      - name: Run Lead Discovery, MX Verification, CRM Sync & Outreach
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          AUTO_SEND_EMAILS: ${{ github.event_name == 'schedule' || inputs.auto_send }}
        run: node scripts/daily-lead-crm-sync.mjs

      - name: Pipeline Completed Summary
        run: echo "Daily CRM Lead Pipeline finished successfully at $(date -u)"
