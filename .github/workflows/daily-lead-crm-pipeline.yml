name: Daily Lead Generation & Rep CRM Outreach Pipeline

on:
  schedule:
    # 09:00 UTC (10:00 AM London) — UK & European Peak Morning Window (Mon-Fri)
    - cron: '0 9 * * 1-5'
    # 14:00 UTC (10:00 AM New York / Toronto) — US & Canada Peak Morning Window (Mon-Fri)
    - cron: '0 14 * * 1-5'
    # 23:00 UTC (10:00 AM Sydney) — Australia Peak Morning Window (Sun-Thu UTC = Mon-Fri AEST)
    - cron: '0 23 * * 0-4'
  workflow_dispatch:
    inputs:
      country:
        description: 'Target Country Filter (AUTO, GB, US, CA, AU, or ALL)'
        required: false
        type: choice
        default: 'AUTO'
        options:
          - 'AUTO'
          - 'GB'
          - 'US'
          - 'CA'
          - 'AU'
          - 'ALL'
      auto_send:
        description: 'Auto-send cold outreach emails via Brevo immediately?'
        required: true
        type: boolean
        default: true

jobs:
  lead-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install --no-audit

      - name: Run Multi-Rep Country-Optimized Outreach Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          TARGET_COUNTRY: ${{ github.event.inputs.country || 'AUTO' }}
          AUTO_SEND_EMAILS: ${{ github.event_name == 'schedule' || inputs.auto_send }}
        run: node scripts/daily-lead-crm-sync.mjs

      - name: Pipeline Completed Summary
        run: echo "Daily CRM Lead Pipeline finished successfully at $(date -u)"
